# Optional Render Blueprint. The service is currently configured via the Render dashboard, so
# this file is inert unless you adopt Blueprints. It documents the durable-persistence secrets:
# both are sync:false so Render prompts for the values instead of committing them to the repo.
services:
  - type: web
    name: cancel
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
